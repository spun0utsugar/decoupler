[package]
name = "openarchive-decoupler"
version = "0.1.0"
edition = "2021"
authors = ["OpenArchive Contributors"]
license = "MIT"
description = "Offline, read-only structural binary decoupler and geometric extractor for legacy archival formats."
repository = "https://example.org/openarchive-decoupler"

[[bin]]
name = "decouple"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
byteorder = "1.5"
flate2 = "1.0"
tiny_http = { version = "0.12", optional = true }

[features]
default = ["gui"]
gui = ["dep:tiny_http"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
