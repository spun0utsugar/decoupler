name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python test suite
        run: python tests/test_decouple.py

      - name: Test pip install & CLI entrypoint
        run: |
          python -m pip install .
          decouple --help

  rust-ci:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: decouple-linux-x86_64
            binary_path: target/release/decouple
          - os: windows-latest
            artifact_name: decouple-windows-x86_64.exe
            binary_path: target/release/decouple.exe
          - os: macos-latest
            artifact_name: decouple-macos-x86_64
            binary_path: target/release/decouple

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --all-targets

      - name: Cargo Test
        run: cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release --verbose

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error
